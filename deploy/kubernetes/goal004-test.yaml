apiVersion: v1
kind: Namespace
metadata:
  name: vpp-goal004
---
apiVersion: v1
kind: Service
metadata:
  namespace: vpp-goal004
  name: echo-two-node
  annotations:
    vpp-gateway.example/test-vip: "198.19.0.20"
spec:
  type: ClusterIP
  ports:
    - name: udp
      protocol: UDP
      port: 18080
    - name: tcp
      protocol: TCP
      port: 18080
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  namespace: vpp-goal004
  name: echo-two-node-manual
  labels:
    kubernetes.io/service-name: echo-two-node
    endpointslice.kubernetes.io/managed-by: vpp-goal004-test
addressType: IPv4
ports:
  - name: udp
    protocol: UDP
    port: 18080
  - name: tcp
    protocol: TCP
    port: 18080
endpoints:
  - addresses: ["10.10.2.2"]
    nodeName: logical-local
    conditions:
      ready: true
  - addresses: ["10.10.4.2"]
    nodeName: logical-remote
    conditions:
      ready: true
