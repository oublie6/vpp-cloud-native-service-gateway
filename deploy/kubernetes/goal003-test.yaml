apiVersion: v1
kind: Namespace
metadata:
  name: vpp-goal003
---
apiVersion: v1
kind: Service
metadata:
  namespace: vpp-goal003
  name: echo
  annotations:
    vpp-gateway.example/test-vip: "198.19.0.20"
spec:
  type: ClusterIP
  ports:
    - name: udp
      protocol: UDP
      port: 18080
    - name: tcp
      protocol: TCP
      port: 18080
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  namespace: vpp-goal003
  name: echo-manual
  labels:
    kubernetes.io/service-name: echo
    endpointslice.kubernetes.io/managed-by: vpp-goal003-test
addressType: IPv4
ports:
  - name: udp
    protocol: UDP
    port: 18080
  - name: tcp
    protocol: TCP
    port: 18080
endpoints:
  - addresses: ["10.10.2.2"]
    conditions:
      ready: true
  - addresses: ["10.10.2.3"]
    conditions:
      ready: true
