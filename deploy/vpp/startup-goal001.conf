unix {
  runtime-dir /run/vpp-goal001
  cli-listen /run/vpp-goal001/cli.sock
  pidfile /run/vpp-goal001/vpp.pid
  log /run/vpp-goal001/vpp.log
}

api-segment {
  prefix goal001
}

socksvr {
  socket-name /run/vpp-goal001/api.sock
}

buffers {
  page-size default
}

plugins {
  plugin dpdk_plugin.so { disable }
}
